[project]
name = "dementia-speech"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "praatio>=6.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dementia_speech"]